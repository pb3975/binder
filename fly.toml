# Binder on Fly.io: a cloud example with tokens, HTTPS, and one volume. Not deployed by CI.
#   fly launch --no-deploy --copy-config --name <your-app>
#   fly volumes create binder_data --size 1 --region <region>
#   fly deploy
#   fly ssh console -C "binder token create --name you"
# See docs/self-hosting.md, "Fly.io".
app = "binder-example"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"
  build-target = "slim"           # "full" adds Chromium previews and needs memory = "1gb"

[env]
  BINDER_PUBLIC_URL = "https://binder-example.fly.dev"

[mounts]
  source = "binder_data"
  destination = "/data"

[http_service]
  internal_port = 8480
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "256mb"                # use "1gb" with the full target
  cpus = 1
