# Releases Binder when a maintainer pushes a version tag such as v0.2.0 (docs/releasing.md).
# On pull requests that touch the release inputs, it runs the same build without publishing,
# so a broken release is caught before the tag.
name: release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - docker/**
      - package.json
      - CHANGELOG.md
      - scripts/release-check.ts
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Tag, package.json, and CHANGELOG.md agree
        run: bun scripts/release-check.ts ${{ env.PUBLISH == 'true' && format('--tag {0}', github.ref_name) || '' }}

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # build provenance attestation
      attestations: write
    strategy:
      matrix:
        target: [slim, full]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # slim is the default image (plain tags); full, with Chromium previews, is opt-in (-full tags).
          flavor: suffix=${{ matrix.target == 'full' && '-full' || '' }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' && !contains(github.ref_name, '-') }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Binder
            org.opencontainers.image.licenses=MIT
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          provenance: mode=max
          sbom: true
          build-args: BINDER_BUILD=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Pull the published image the way a stranger would (no login) and check it reports this version.
  smoke:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous pull and health check
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY}:${version}"
          docker logout ghcr.io || true
          docker pull "$image"
          docker run -d --name binder -p 127.0.0.1:8480:8480 "$image"
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8480/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8480/healthz | grep -q "\"version\":\"${version}\""

  github-release:
    if: github.event_name == 'push'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Create the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          bun scripts/release-check.ts --notes "$version" > notes.md
          {
            echo
            echo "## Images"
            echo
            echo '```sh'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}:${version}        # slim (default)"
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}:${version}-full   # with Chromium previews"
            echo '```'
          } >> notes.md
          prerelease=""; case "$version" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Binder $version" --notes-file notes.md $prerelease
