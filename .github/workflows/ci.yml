name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest # public repo: never self-hosted, so fork PRs cannot reach private machines
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Typecheck and tests (contract, history, migration, auth)
        run: bun run check
      - name: package.json and CHANGELOG.md agree
        run: bun scripts/release-check.ts
      - name: Compose file is valid
        # The docker:cli image ships the compose plugin, so this works on runners without it.
        run: docker run --rm -v "$PWD:/w:ro" -w /w docker:27.5-cli docker compose config -q

  e2e:
    runs-on: ubuntu-latest # public repo: never self-hosted, so fork PRs cannot reach private machines
    strategy:
      fail-fast: false
      matrix:
        target: [full, slim]
    steps:
      - uses: actions/checkout@v4
      - name: Container end-to-end (${{ matrix.target }} image)
        run: TARGET=${{ matrix.target }} scripts/e2e.sh binder:ci-${{ matrix.target }}-${{ github.run_id }}

  # Signs in through a real Keycloak (pinned in the script) in Chromium: allowed and refused
  # users, sign-out, and agent tokens in oidc mode.
  e2e-oidc:
    runs-on: ubuntu-latest # public repo: never self-hosted, so fork PRs cannot reach private machines
    steps:
      - uses: actions/checkout@v4
      - name: OIDC end-to-end with Keycloak
        run: mkdir -p shots && SHOTS=shots scripts/e2e-oidc.sh binder:ci-oidc-${{ github.run_id }}
      - name: Keep the sign-in screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-signin-screenshots
          path: shots/
          if-no-files-found: ignore

  # Proves the image builds on arm64 (Raspberry Pi, Apple silicon hosts, Graviton).
  # GitHub's arm runners are free for public repositories only, so this runs once the repo is public.
  arm64:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Container end-to-end on arm64 (slim image)
        run: TARGET=slim scripts/e2e.sh binder:ci-arm64
