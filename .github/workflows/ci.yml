name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest # public repo: never self-hosted, so fork PRs cannot reach private machines
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Typecheck and tests (contract, history, migration, auth)
        run: bun run check
      - name: package.json and CHANGELOG.md agree
        run: bun scripts/release-check.ts
      - name: Workflows use GitHub-hosted runners and pinned actions (AGENTS.md)
        run: scripts/check-workflows.sh
      - name: Compose file is valid
        # The docker:cli image ships the compose plugin, so this works on runners without it.
        run: docker run --rm -v "$PWD:/w:ro" -w /w docker:27.5-cli docker compose config -q

  # The landing page (site/), as GitHub Pages serves it: built output checks, then real Chrome
  # at phone and desktop widths in light and dark. test/site.test.ts also runs in `check`.
  site:
    runs-on: ubuntu-latest # public repo: never self-hosted, so fork PRs cannot reach private machines
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Built page (links, origins, CSP, commands match README)
        run: bun test test/site.test.ts
      - name: Landing page in Chrome (the runner's preinstalled Chrome)
        run: mkdir -p shots && CHROMIUM=$(command -v google-chrome) SHOTS=shots scripts/e2e-site.sh
      - name: Keep the landing page screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: landing-page-screenshots
          path: shots/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest # public repo: never self-hosted, so fork PRs cannot reach private machines
    strategy:
      fail-fast: false
      matrix:
        target: [full, slim]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Container end-to-end (${{ matrix.target }} image)
        run: TARGET=${{ matrix.target }} scripts/e2e.sh binder:ci-${{ matrix.target }}-${{ github.run_id }}

  # S3 storage with Litestream, against MinIO: restore into a new container, wrong credentials, task-role credentials.
  e2e-s3:
    runs-on: ubuntu-latest # public repo: never self-hosted, so fork PRs cannot reach private machines
    strategy:
      fail-fast: false
      matrix:
        target: [slim, full] # full also checks that previews are stored in and served from S3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: S3 storage end-to-end (${{ matrix.target }} image, MinIO)
        run: TARGET=${{ matrix.target }} scripts/e2e-s3.sh binder:ci-s3-${{ matrix.target }}-${{ github.run_id }}

  # Signs in through a real Keycloak (pinned in the script) in Chromium: allowed and refused
  # users, sign-out, and agent tokens in oidc mode.
  e2e-oidc:
    runs-on: ubuntu-latest # public repo: never self-hosted, so fork PRs cannot reach private machines
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: OIDC end-to-end with Keycloak
        run: mkdir -p shots && SHOTS=shots scripts/e2e-oidc.sh binder:ci-oidc-${{ github.run_id }}
      - name: Keep the sign-in screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oidc-signin-screenshots
          path: shots/
          if-no-files-found: ignore

  # Proves the image builds on arm64 (Raspberry Pi, Apple silicon hosts, Graviton).
  # GitHub's arm runners are free for public repositories only, so this runs once the repo is public.
  arm64:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Container end-to-end on arm64 (slim image)
        run: TARGET=slim scripts/e2e.sh binder:ci-arm64

  # The AWS quick start (deploy/aws, docs/aws.md): CDK assertions, then synth and cfn-lint.
  # Needs no AWS credentials and deploys nothing.
  aws:
    runs-on: ubuntu-latest # public repo: never self-hosted, so fork PRs cannot reach private machines
    defaults:
      run:
        working-directory: deploy/aws
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0; the CDK CLI runs on Node
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Typecheck and CDK assertions
        run: bun run check
      - name: Install cfn-lint
        run: pipx install cfn-lint==1.60.1
      - name: Synth (token default, OIDC + HTTPS) and cfn-lint
        run: bun run synth-check
